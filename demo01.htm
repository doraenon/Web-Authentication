<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>上网认证</title><style>*{margin:0;padding:0;-webkit-appearance:none;-moz-appearance:none;appearance:none;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif}body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(rgba(0,72,152,.9),rgba(0,72,152,.5),rgba(0,72,152,.1),#004898);padding:15px}.login-container{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-radius:25px;padding:2rem;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.1);border:1px solid rgba(255,255,255,0.2)}.header{text-align:center;margin-bottom:2rem}.header h1{color:#2c3e50;font-size:1.8rem;margin-bottom:0.5rem}.header p{color:#7f8c8d;font-size:0.9rem}.input-container{margin-bottom:1.5rem;position:relative}.input-container:after{content:'*';color:#f44;position:absolute;right:15px;top:50%;transform:translateY(-50%);pointer-events:none;}.input-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#95a5a6;width:20px;height:20px}input{width:100%;padding:15px 15px 15px 45px;border:1px solid #aaa;border-radius:12px;font-size:1rem;transition:all 0.3s ease}input:focus{outline:none;border-color:#3498db;box-shadow:0 0 8px rgba(52,152,219,0.2)}.button{width:100%;padding:15px;background:#174;color:white;border:none;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer;transition:transform 0.2s ease}.button:active{background:#198754}.footer{margin-top:1.5rem;text-align:center}.footer a{color:#3498db;text-decoration:none;font-size:0.9rem}@media (max-width:480px){.login-container{padding:1.5rem;border-radius:20px}input{padding:12px 12px 12px 40px;font-size:0.95rem}.button{padding:12px}}</style></head><body>
<!--[if IE]><style>body{background:#cadaed}.login-container{margin:50px auto}.button{background:#174}.ie{color:#f00;text-align:center}</style><br/><div class="ie">您的浏览器过旧官方已停止维护,请升级以获得更好体验</div><![endif]-->
<div class="login-container"><div class="header"><h1>WiFi认证</h1></div><div class="input-container"><svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><input name="usr" id="usr" type="text" placeholder="用户名" onchange="val_edit(this)" onclick="val_edit(this)" maxlength="10" autofocus="autofocus" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" oncontextmenu="return false" onpaste="return false" oncopy="return false" oncut="return false" ondragstart="return false" ondragenter="return false" draggable="false" ondragover="return false" ondrop="return false" onkeyup="value=value.replace(/[^\x00-\x80]|(\s)/gi,'')"/></div><div class="input-container"><svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg><input name="pwd" id="pwd" type="password" placeholder="密码" onchange="val_edit(this)" onclick="val_edit(this)" maxlength="20" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" oncontextmenu="return false" onpaste="return false" oncopy="return false" oncut="return false" ondragstart="return false" ondragenter="return false" draggable="false" ondragover="return false" ondrop="return false" onkeyup="value=value.replace(/[^\x00-\x80]|(\s)/gi,'')"/></div><input style="display:none;" name="save" id="save" type="checkbox" disabled="disabled"/><input id="t" type="button" class="button" onclick="y()" value="登 录"/><div class="footer"><a href="javascript:void(0);" onclick="alert('请联系管理员！');">忘记密码？</a></div></div><script>document.onkeydown=function(e){if(!e)e=window.event;if((e.keyCode||e.which)==13){document.getElementById('t').click()}}</script><script>var last=0;function y(){var now=new Date().getTime();var ue=document.getElementById('usr');var pd=document.getElementById('pwd');if(ue.value===''||ue.value.length>10||pd.value.length<6||pd.value.length>20){alert("用户名限制1-10个字符,\n密码限制6-20个字符,\n请重新输入!");ue.value='';pd.value='';return false}else if(now<last+5000){ue.value='';pd.value='';alert("请勿短时间内频繁提交！");return false;}last=now;document.getElementById('save').checked=false;tijiao();ue.value='';pd.value=''}</script></body></html>
